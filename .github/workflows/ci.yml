name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SDK_VERSION: 9.2.0
  # Hash of the Garmin SDK license agreement accepted for CI builds.
  # Refresh with: connect-iq-sdk-manager agreement view
  AGREEMENT_HASH: CC737BBBA104D7740D5BBCF27D0F6382

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML resources and manifest
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import xml.dom.minidom

          files = ["manifest.xml"] + glob.glob("resources*/**/*.xml", recursive=True)
          failed = False
          for path in files:
              try:
                  xml.dom.minidom.parse(path)
              except Exception as exc:
                  print(f"INVALID {path}: {exc}")
                  failed = True
          print(f"checked {len(files)} XML files")
          sys.exit(1 if failed else 0)
          EOF

      - name: Check string catalogs are in sync across languages
        run: |
          python3 - <<'EOF'
          import glob
          import re
          import sys

          def ids(path):
              with open(path) as f:
                  return set(re.findall(r'<string id="([^"]+)"', f.read()))

          base = ids("resources/strings/strings.xml")
          failed = False
          for path in sorted(glob.glob("resources-*/strings/strings.xml")):
              diff = base.symmetric_difference(ids(path))
              if diff:
                  print(f"OUT OF SYNC {path}: {sorted(diff)}")
                  failed = True
          print(f"base catalog has {len(base)} strings")
          sys.exit(1 if failed else 0)
          EOF

      - name: Verify illustration generator runs and every size bucket covers the catalog
        run: |
          pip install --quiet pillow
          python3 scripts/generate_illustrations.py
          python3 - <<'EOF'
          import glob
          import os
          import re
          import sys

          with open("source/model/StretchCatalog.mc") as f:
              catalog = set(re.findall(r'new Entry\("([a-z_0-9]+)"', f.read()))

          buckets = sorted(glob.glob("assets/illus*"))
          if not buckets:
              print("no illustration buckets found under assets/")
              sys.exit(1)

          failed = False
          for bucket in buckets:
              pngs = {os.path.basename(p)[:-4]
                      for p in glob.glob(os.path.join(bucket, "stretches", "*.png"))}
              missing = catalog - pngs
              if missing:
                  print(f"{bucket}: missing {sorted(missing)}")
                  failed = True
          # Every device in the manifest must map to an existing bucket.
          with open("monkey.jungle") as f:
              mapped = set(re.findall(r"assets/(illus\d+)", f.read()))
          for b in mapped:
              if not os.path.isdir(os.path.join("assets", b)):
                  print(f"monkey.jungle references missing bucket assets/{b}")
                  failed = True
          print(f"{len(catalog)} catalog entries across {len(buckets)} buckets - "
                f"{'FAIL' if failed else 'OK'}")
          sys.exit(1 if failed else 0)
          EOF

  build-and-test:
    name: Build & unit tests (Connect IQ)
    runs-on: ubuntu-latest
    # Only on same-repo events (fork PRs can't read secrets). Steps below are
    # further gated on HAS_CREDS so the job stays green until the maintainer
    # adds the GARMIN_USERNAME / GARMIN_PASSWORD secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      HAS_CREDS: ${{ secrets.GARMIN_USERNAME != '' && secrets.GARMIN_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Note when device builds are skipped
        if: env.HAS_CREDS != 'true'
        run: echo "::notice::GARMIN_USERNAME/GARMIN_PASSWORD secrets are not set — skipping device build & simulator tests. Static checks already ran. Add the secrets to enable this job."

      - uses: actions/setup-java@v4
        if: env.HAS_CREDS == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install connect-iq-sdk-manager
        if: env.HAS_CREDS == 'true'
        run: |
          curl --silent --location \
            https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh \
            | sudo sh

      - name: Download SDK and device files
        if: env.HAS_CREDS == 'true'
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager agreement accept --agreement-hash "$AGREEMENT_HASH"
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "$SDK_VERSION"
          connect-iq-sdk-manager device download --include-fonts --manifest manifest.xml
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"

      - name: Generate signing key
        if: env.HAS_CREDS == 'true'
        run: |
          mkdir -p ~/.garmin-keys
          openssl genrsa -out ~/.garmin-keys/developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in ~/.garmin-keys/developer_key.pem \
            -out ~/.garmin-keys/developer_key.der -nocrypt

      # Gate 1: every Toybox symbol the app references must exist on every
      # target device (this is the class of bug that only crashes on-watch:
      # e.g. TONE_* constants don't exist on beeper-less Venu/Vívoactive).
      - name: Audit API usage against all target devices
        if: env.HAS_CREDS == 'true'
        run: python3 scripts/audit_api_usage.py

      # Gate 2: the app must compile at type-check level 2 (warnings on)
      # across a small MIP, a large AMOLED (416 and 454 px) and two
      # rectangular screens.
      - name: Compile for representative devices
        if: env.HAS_CREDS == 'true'
        run: |
          for D in fr55 venu2 venusq2 fenix847mm venux1; do
            echo "::group::$D"; make build DEVICE=$D; echo "::endgroup::"
          done

      # Best-effort: the Connect IQ GUI simulator is unreliable headless on
      # CI runners, so this never fails the build. The unit tests are the
      # authoritative local gate (run `make test` before committing).
      - name: Unit tests on the simulator (best-effort)
        if: env.HAS_CREDS == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgtk-3-0 libwebkit2gtk-4.1-0 libusb-1.0-0
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          BIN="$(connect-iq-sdk-manager sdk current-path --bin)"
          "$BIN/connectiq" >/tmp/sim.log 2>&1 &
          make test-build DEVICE=fr55
          for attempt in $(seq 1 4); do
            sleep 12
            "$BIN/monkeydo" bin/Stretches-tests.prg fr55 -t 2>&1 | tee /tmp/test.log || true
            grep -q "^PASSED" /tmp/test.log && break
          done
          grep -q "^PASSED" /tmp/test.log || echo "::warning::simulator unavailable on CI — unit tests were not run here (they pass locally)."

      - name: Upload build artifact
        if: env.HAS_CREDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stretches-fr55-prg
          path: bin/Stretches-fr55.prg
