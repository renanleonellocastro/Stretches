[project]
name = "stretches-tools"
version = "0"
description = "Quality tooling for the Stretches repository"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C90", "N", "TC", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = [
  "check_function_length",
  "function_length_model",
  "function_length_monkeyc",
  "function_length_python",
]
